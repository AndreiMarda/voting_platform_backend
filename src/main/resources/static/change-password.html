<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 100%; max-width: 340px; box-sizing: border-box; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { margin: 0 0 1.25rem; font-size: .9rem; color: #475569; }
    label { display: block; margin-bottom: 1rem; font-size: .9rem; }
    input { display: block; width: 100%; margin-top: .25rem; padding: .55rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: .65rem; border: 0; border-radius: 4px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    #msg { padding: .6rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; display: none; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Choose a new password</h1>
    <p>You must set your own password before you can continue.</p>
    <div id="msg"></div>
    <label>Current password
      <input type="password" id="current" autocomplete="current-password" required autofocus>
    </label>
    <label>New password (8–72 characters)
      <input type="password" id="next" autocomplete="new-password" minlength="8" maxlength="72" required>
    </label>
    <label>Repeat new password
      <input type="password" id="again" autocomplete="new-password" required>
    </label>
    <button type="submit">Change password</button>
  </form>
  <script>
    const msg = document.getElementById('msg');
    const show = t => { msg.textContent = t; msg.style.display = 'block'; };
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      msg.style.display = 'none';
      const next = document.getElementById('next').value;
      if (next !== document.getElementById('again').value) return show('The new passwords do not match.');
      const r = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: document.getElementById('current').value, newPassword: next })
      });
      if (r.status === 204) { location.href = '/'; return; }
      if (r.status === 401) { location.href = '/login.html'; return; }
      const body = await r.json().catch(() => ({}));
      show(body.detail ||'Could not change the password.');
    });
  </script>
</body>
</html>
