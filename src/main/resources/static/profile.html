<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <h1>My profile</h1>
    <div class="card">
      <p class="meta" id="intro"></p>
      <form id="f">
        <div class="form-error" id="error" role="alert" hidden></div>
        <label>Username
          <input id="username" disabled>
        </label>
        <label>Email address (required)
          <input id="email" name="email" type="email" maxlength="254" required autocomplete="email">
        </label>
        <label>ID ONCR (two capital letters and digits, at most 7 characters, e.g. AB12345)
          <input id="idOncr" name="idOncr" maxlength="7" autocomplete="off" pattern="[A-Za-z]{2}[0-9]{1,5}"
                 title="Two letters followed by 1 to 5 digits, e.g. AB12345" style="text-transform: uppercase">
        </label>
        <p class="meta">Without an ID ONCR you can sign in, but you cannot vote.</p>
        <div class="row"><button type="submit">Save</button></div>
      </form>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
