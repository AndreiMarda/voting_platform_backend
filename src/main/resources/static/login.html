<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 100%; max-width: 320px; box-sizing: border-box; }
    h1 { margin: 0 0 1.25rem; font-size: 1.4rem; }
    label { display: block; margin-bottom: 1rem; font-size: .9rem; }
    input { display: block; width: 100%; margin-top: .25rem; padding: .55rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: .65rem; border: 0; border-radius: 4px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    .msg { padding: .6rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; display: none; }
    .error { background: #fee2e2; color: #991b1b; }
    .info { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Voting platform</h1>
    <div id="error" class="msg error">Invalid username or password.</div>
    <div id="logout" class="msg info">You have been signed out.</div>
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.has('error')) document.getElementById('error').style.display = 'block';
    if (q.has('logout')) document.getElementById('logout').style.display = 'block';
  </script>
</body>
</html>
