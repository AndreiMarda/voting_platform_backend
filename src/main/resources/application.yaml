server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict

voting:
  # The most people who can be online at the same time (admins are always let in). Set MAX_ONLINE in .env to change it.
  max-online: ${MAX_ONLINE:60}
  # Password a user gets when an admin resets it. They are forced to change it at next login.
  default-password: ${DEFAULT_PASSWORD}   # required; set it in .env (see .env.example)
  # Brute-force protection on the login: this many wrong passwords within the window blocks that username
  # (or, with the larger limit, that IP address) until the oldest failure leaves the window.
  login:
    max-failures-per-user: 5
    max-failures-per-ip: 30
    window: PT15M
  # First admin, created at startup only if no admin exists yet. Set both in .env.
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

spring:
  mvc:
    problemdetails:
      enabled: true   # error responses carry {"detail": "<reason>"} for the frontend to display
  config:
    import: optional:file:.env[.properties]
  application:
    name: voting
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nord_cluj_voting_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
